<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI RPG — PvP 1v1</title>
<link rel="stylesheet" href="battle.css">
</head>
<body>
<main class="battle-app">
<header class="topbar">
  <div><div class="eyebrow">AI RPG / ARENA</div><h1>PvP 1v1</h1><p id="roomLabel">Il server osserva. I combattenti giocano a turni.</p></div>
  <a class="back" href="/">← Editor personaggi</a>
</header>

<section id="setup" class="card setup">
  <div class="fighter"><label for="fighterA">COMBATTENTE A</label><select id="fighterA"><option value="">Seleziona personaggio</option></select><div id="previewA" class="preview">Nessun combattente selezionato.</div></div>
  <div class="versus">VS</div>
  <div class="fighter"><label for="fighterB">COMBATTENTE B</label><select id="fighterB"><option value="">Seleziona personaggio</option></select><div id="previewB" class="preview">Nessun combattente selezionato.</div></div>
  <button id="createRoom" class="fight" disabled>⚔ CREA STANZA PvP</button>
  <div id="links" class="links hidden"></div>
</section>

<section id="arena" class="hidden">
  <div id="roleBadge" class="role-badge">SERVER</div>
  <div id="turnBanner" class="turn-banner">Caricamento...</div>
  <div id="fighters" class="fighters"></div>
  <section id="actions" class="card actions">
    <div class="actions-head"><span>AZIONI</span><strong id="apLabel">PA —</strong></div>
    <div id="actionButtons" class="action-buttons"></div>
    <button id="endTurn" class="end-turn">FINE TURNO</button>
    <div id="actionMessage" class="action-message"></div>
  </section>
  <section class="card log-panel"><div class="log-head"><span>CRONACA DELLO SCONTRO</span><span id="roundLabel">ROUND 1</span></div><div id="combatLog" class="combat-log"></div></section>
</section>
</main>
<script src="battle.js"></script>
</body>
</html>
